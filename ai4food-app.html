<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI4Food - Bien manger. Moins gaspiller.</title>
<meta name="description" content="AI4Food sauve les invendus des restaurants, hôtels, boulangeries et marchés de Dakar. Réservez un panier à petit prix, le commerçant jette moins.">
<meta name="theme-color" content="#0A2E27" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI4Food">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14231F;--forest:#0E3D34;--forest2:#145143;--emerald:#2F6B4F;
  --mint:#A8D5B5;--mint2:#C6E4CE;--pale:#DFF0E2;--cream:#FBF7F0;--white:#fff;
  --muted:#6B7B75;--strike:#9AA8A2;--gold:#2F6B4F;
  --water:#CFE2E4;--land:#FBF7F0;--mint-line:#BFD8CA;--danger:#B03A4C;--amber:#B8722A;
  --glass:rgba(251,247,240,.96);--frost:rgba(255,255,255,.95);--page:#0A2E27;
  --line:rgba(20,35,31,.09);--line2:rgba(20,35,31,.16);
  --dp:'Plus Jakarta Sans',system-ui,sans-serif;--bd:'Inter',system-ui,sans-serif;
  --sh:0 1px 2px rgba(20,35,31,.04),0 8px 24px -12px rgba(20,35,31,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--bd);color:var(--ink);min-height:100vh;padding:26px 16px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 620px at 12% -5%,#145143 0%,transparent 58%),
             radial-gradient(700px 500px at 95% 100%,#0E3D34 0%,transparent 60%),#0A2E27}
.stage{display:flex;align-items:center;justify-content:center}
svg{display:block}

/* ---------- brand panel ---------- */
.pitch{max-width:300px;color:#EAF3EC}
.lock{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.wordmark{font-family:var(--dp);font-weight:800;font-size:38px;letter-spacing:-.03em;color:#fff;line-height:1}
.wordmark em{font-style:normal;color:var(--mint)}
.pitch .tag{font-family:var(--dp);font-size:18px;font-weight:600;color:var(--mint);margin:0 0 6px;letter-spacing:-.01em}
.pitch .sub{font-size:13.5px;color:#A9C4BC;margin:0 0 24px}
.marks{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.mk{border-radius:16px;display:grid;place-items:center}
.mk.a{width:58px;height:58px;background:linear-gradient(150deg,#2F6B4F,#0E3D34);box-shadow:0 10px 26px -10px rgba(0,0,0,.7)}
.mk.b{width:58px;height:58px;background:var(--mint)}
.mk.c{width:58px;height:58px;background:#fff}
.pitch .kv{font-family:var(--dp);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7FA79B;margin-bottom:9px}
.pitch ul{margin:0 0 18px;padding-left:16px;font-size:13px;color:#CFE2DA;line-height:1.85}
.pitch .fine{font-size:11px;color:#7FA79B;line-height:1.6;margin:0}

/* ---------- device ---------- */
.phone{width:392px;height:816px;max-width:100%;background:var(--cream);border-radius:48px;
  border:11px solid #05201B;position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 50px 100px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.06)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:112px;height:27px;background:#05201B;border-radius:16px;z-index:90}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:15px 28px 4px;font-family:var(--dp);font-size:12.5px;font-weight:700;z-index:89;letter-spacing:-.01em}
.sbar.dark{color:#EAF3EC}
.sbar .rt{display:flex;gap:5px;align-items:center;opacity:.9}
.view{flex:1;overflow-y:auto;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
button{font-family:var(--bd);cursor:pointer;color:inherit}
button:focus-visible{outline:2.5px solid var(--emerald);outline-offset:2px}
.grain{background-image:radial-gradient(circle at 50% 50%,rgba(168,213,181,.14) 1.5px,transparent 1.8px);background-size:17px 17px}

/* ---------- onboarding ---------- */
#ob{position:absolute;inset:0;z-index:80;padding:0 32px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(165deg,#145143 0%,#0A2E27 55%,#0A2E27 100%)}
#ob.hide{opacity:0;pointer-events:none;transition:opacity .5s ease}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
#ob h2,#ob .t,#ob .s,#ob .start{animation:rise .6s cubic-bezier(.2,.9,.3,1)}
#ob h2{font-family:var(--dp);font-weight:800;font-size:44px;color:#fff;margin:0;letter-spacing:-.035em}
#ob h2 em{font-style:normal;color:var(--mint)}
#ob .t{font-family:var(--dp);font-weight:600;font-size:17px;color:var(--mint);line-height:1.4;margin:10px 0 0;letter-spacing:-.01em}
#ob .s{font-size:13.5px;color:#A9C4BC;line-height:1.65;margin:0;position:relative}
#ob .dots{display:flex;gap:6px;margin-top:2px}
#ob .dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
#ob .dots i.on{background:var(--mint);width:22px}
.start{width:100%;max-width:300px;position:absolute;bottom:56px;left:32px;right:32px;background:var(--mint);color:#0A2E27;border:none;border-radius:17px;padding:17px;
  font-family:var(--dp);font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin-top:16px;
  box-shadow:0 14px 30px -14px rgba(168,213,181,.9)}

/* ---------- header ---------- */
.head{padding:8px 22px 14px;display:flex;justify-content:space-between;align-items:center}
.head .hi{font-size:12.5px;color:var(--muted);font-weight:450}
.head .city{font-family:var(--dp);font-weight:700;font-size:21px;letter-spacing:-.025em;display:flex;align-items:center;gap:5px;margin-top:2px}
.round{width:42px;height:42px;border-radius:14px;background:var(--white);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh);position:relative;color:var(--forest)}
.round .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--emerald);border:2px solid #fff}
.search{margin:0 22px 20px;background:var(--white);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;box-shadow:var(--sh)}
.search svg{color:var(--emerald)}

/* ---------- sections ---------- */
.sec{padding:0 22px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sec h2{font-family:var(--dp);font-weight:700;font-size:18px;margin:0;letter-spacing:-.025em}
.eyebrow{display:inline-flex;align-items:center;gap:5px;font-family:var(--dp);font-size:10px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--emerald);margin-bottom:5px}
.sec p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.link{font-family:var(--dp);font-size:12.5px;color:var(--emerald);font-weight:600;display:flex;align-items:center;gap:2px;background:none;border:none;padding:0}
.chips{display:flex;gap:8px;padding:0 22px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--white);border-radius:12px;
  padding:9px 15px;font-size:12.5px;font-weight:500;box-shadow:var(--sh)}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}

/* ---------- offer card ---------- */
.list{padding:0 22px 16px;display:flex;flex-direction:column;gap:13px}
.rc{display:flex;gap:13px;background:var(--white);border:1px solid var(--line);border-radius:20px;
  padding:11px;width:100%;text-align:left;box-shadow:var(--sh);transition:transform .14s}
.rc:active{transform:scale(.985)}
.thumb{width:110px;flex-shrink:0;border-radius:15px;position:relative;overflow:hidden;min-height:110px;background:var(--pale)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,35,31,.42),transparent 55%)}
.thumb .left{position:absolute;left:8px;bottom:8px;z-index:2;background:var(--frost);color:var(--forest);
  font-family:var(--dp);font-weight:700;font-size:9.5px;padding:4px 8px;border-radius:8px;letter-spacing:-.01em}
.rc-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:2px 2px 2px 0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rc-top h3{font-family:var(--dp);font-weight:700;font-size:15px;margin:0;letter-spacing:-.02em;line-height:1.25}
.hbtn{background:none;border:none;padding:2px;color:var(--muted);flex-shrink:0}
.hbtn.on{color:var(--danger)}
.mrc{margin:2px 0 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:500}
.rate svg{color:var(--gold)}
.prices{margin:7px 0 0;display:flex;align-items:baseline;gap:7px}
.prices b{font-family:var(--dp);font-size:16.5px;font-weight:700;letter-spacing:-.03em;color:var(--forest)}
.prices b i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:0}
.prices s{color:var(--strike);font-size:11.5px}
.save{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:8px;background:var(--pale);
  color:var(--emerald);font-size:11px;font-weight:600;padding:5px 9px;border-radius:9px}
.ainote{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(120deg,var(--pale),#fff);
  border:1px solid var(--mint2);color:var(--forest);font-size:10.5px;font-weight:600;padding:4px 8px;
  border-radius:8px;margin-bottom:6px;align-self:flex-start}
.ainote svg{color:var(--emerald)}

.vrow{align-items:center}
.vtile{width:52px;height:52px;flex-shrink:0;border-radius:15px;background:var(--pale);color:var(--forest);display:grid;place-items:center}
.invite{align-self:flex-start;margin-top:8px;display:inline-flex;align-items:center;gap:5px;background:var(--white);
  border:1px solid var(--line2);color:var(--forest);font-family:var(--dp);font-weight:600;font-size:11.5px;padding:7px 11px;border-radius:10px}
.invite:active{background:var(--pale)}

.mapwrap{position:relative;margin:0 22px 14px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
.mapsvg{width:100%;height:300px;display:block}
.zl{font-family:var(--dp);font-size:8.5px;font-weight:600;fill:var(--muted);text-anchor:middle;letter-spacing:.02em}
.maplg{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;background:var(--glass);
  padding:7px 11px;border-radius:11px;font-size:10.5px;color:var(--muted);font-weight:500}
.maplg span{display:flex;align-items:center;gap:5px}
.maplg .d{width:9px;height:9px;border-radius:50%;background:#fff;border:1.8px solid var(--emerald);display:inline-block}
.maplg .d.live{background:var(--forest);border-color:var(--forest)}
.hintline{margin:0 22px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}

.roleswap{margin:0 22px 18px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.rl{font-family:var(--dp);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald);margin-bottom:10px}
.rbtns{display:flex;gap:7px}
.rb{flex:1;border:1px solid var(--line2);background:var(--white);border-radius:12px;padding:10px 6px;
  font-family:var(--dp);font-weight:600;font-size:12.5px;color:var(--ink)}
.rb.on{background:var(--forest);border-color:var(--forest);color:#fff}
.rn{margin:10px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.sub2{margin:-6px 22px 14px;font-size:12.5px;color:var(--muted)}

/* ---------- tab bar ---------- */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(14px);padding:8px 8px 16px}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9.5px;color:var(--muted);font-weight:500;padding:6px 0;border-radius:14px}
.tab.on{color:var(--forest);font-weight:600;background:var(--pale)}

/* ---------- sheet ---------- */
.sheet{position:absolute;inset:0;z-index:70;background:var(--cream);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.9,.28,1)}
.sheet.open{transform:translateY(0)}
.hero{height:268px;position:relative;flex-shrink:0;overflow:hidden;background:var(--pale)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .sc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,35,31,.45) 0%,transparent 34%,transparent 62%,rgba(20,35,31,.35) 100%)}
.hero .nav{position:absolute;z-index:4;top:54px;left:18px;right:18px;display:flex;justify-content:space-between}
.hero .nav .g{display:flex;gap:9px}
.circ{width:38px;height:38px;border-radius:13px;background:var(--frost);border:none;
  display:grid;place-items:center;color:var(--forest);backdrop-filter:blur(6px)}
.circ.on{color:var(--danger)}
.hero .left{position:absolute;z-index:4;bottom:48px;left:20px;background:var(--frost);color:var(--forest);
  font-family:var(--dp);font-weight:700;font-size:11px;padding:6px 11px;border-radius:10px}
.detail{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--cream);border-radius:28px 28px 0 0;
  margin-top:-28px;padding:24px 22px 20px;position:relative;z-index:3}
.detail::-webkit-scrollbar{display:none}
.detail h2{font-family:var(--dp);font-weight:700;font-size:24px;margin:0;letter-spacing:-.035em;line-height:1.15}
.by{font-size:13px;color:var(--muted);margin:5px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pline{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.pline b{font-family:var(--dp);font-size:24px;font-weight:700;letter-spacing:-.035em;color:var(--forest)}
.pline b i{font-style:normal;font-size:12.5px;font-weight:600;letter-spacing:0}
.pline s{color:var(--strike);font-size:13px}
.desc{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0 0 18px}
.info{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.info .r{display:flex;gap:13px;padding:13px 0;align-items:flex-start}
.info .r+.r{border-top:1px solid var(--line)}
.info .r>svg{color:var(--emerald);flex-shrink:0;margin-top:1px}
.info .r p{margin:0;font-size:13.5px;flex:1;font-weight:450}
.info .r p small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:3px;font-weight:400}
.info .r .lnk{color:var(--emerald);font-size:12.5px;font-weight:600;background:none;border:none;padding:4px 0 0;display:flex;align-items:center;gap:3px}
.good{background:linear-gradient(140deg,var(--pale),#fff);border:1px solid var(--mint2);border-radius:18px;padding:15px 17px;margin-bottom:16px}
.good h4{font-family:var(--dp);font-size:13.5px;margin:0 0 9px;font-weight:700;color:var(--emerald);display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.good li{font-size:12.5px;color:#3D5A4E;line-height:1.55;margin-bottom:5px;list-style:none;display:flex;gap:8px;align-items:flex-start}
.good ul{margin:0;padding:0}
.good li svg{color:var(--emerald);flex-shrink:0;margin-top:2px}
.stepper{display:flex;align-items:center;gap:15px;margin-top:4px}
.stepper button{width:33px;height:33px;border-radius:11px;border:1px solid var(--line2);background:var(--white);display:grid;place-items:center}
.stepper span{font-family:var(--dp);font-weight:700;font-size:15px;min-width:14px;text-align:center}
.bar{padding:14px 22px 26px;background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);flex-shrink:0}
.btn{width:100%;border:none;border-radius:17px;padding:17px;font-family:var(--dp);font-weight:700;font-size:15.5px;
  letter-spacing:-.015em;display:flex;align-items:center;justify-content:center;gap:9px}
.btn-main{background:var(--forest);color:#fff;box-shadow:0 14px 28px -16px rgba(14,61,52,.95)}
.btn-mint{background:var(--mint);color:#0A2E27}
.btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--line2)}
.note{text-align:center;font-size:11.5px;color:var(--muted);margin:10px 0 0}
.seg{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.seg button{background:none;border:none;padding:0 0 12px;font-size:13.5px;color:var(--muted);position:relative;font-weight:500}
.seg button.on{color:var(--forest);font-weight:600}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--emerald);border-radius:3px}

/* ---------- payment ---------- */
.pay{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line);background:var(--white);
  border-radius:17px;padding:14px;margin-bottom:11px;width:100%;text-align:left;box-shadow:var(--sh)}
.pay.on{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(47,107,79,.10)}
.pay .lg{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--dp);
  font-weight:800;font-size:12.5px;color:#fff;letter-spacing:-.02em}
.pay .t{flex:1}
.pay .t b{display:block;font-size:13.5px;font-weight:600}
.pay .t span{font-size:11.5px;color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0}
.pay.on .radio{border-color:var(--emerald);background:var(--emerald);color:#fff}

/* ---------- ticket ---------- */
.ticket{border-radius:24px;overflow:hidden;color:#EAF3EC;margin:0 22px 14px;
  background:linear-gradient(155deg,#145143,#0A2E27);box-shadow:0 22px 44px -24px rgba(10,46,39,.9)}
.tk-top{padding:22px 22px 18px}
.tk-top h3{font-family:var(--dp);font-weight:700;font-size:20px;margin:0;color:#fff;letter-spacing:-.03em}
.tk-top p{margin:5px 0 18px;font-size:12.5px;color:#A9C4BC}
.tk-top .lbl{font-family:var(--dp);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);display:flex;align-items:center;gap:6px}
.tk-top .win{font-family:var(--dp);font-size:26px;font-weight:700;margin:5px 0 0;color:#fff;letter-spacing:-.03em}
.perf{position:relative;height:24px}
.perf::before,.perf::after{content:"";position:absolute;top:0;width:24px;height:24px;border-radius:50%;background:var(--cream)}
.perf::before{left:-12px}.perf::after{right:-12px}
.perf i{position:absolute;top:12px;left:16px;right:16px;border-top:2px dashed rgba(234,243,236,.3);display:block}
.tk-bot{padding:6px 22px 22px;display:flex;gap:17px;align-items:center}
.qr{width:78px;height:78px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  gap:1.5px;background:#fff;padding:6px;border-radius:12px;flex-shrink:0}
.qr i{border-radius:1px}
.qr i.f{background:#0A2E27}
.tk-bot .cl{font-family:var(--dp);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8FB3A8}
.tk-bot .code{font-family:var(--dp);font-size:23px;font-weight:700;letter-spacing:.04em;margin:3px 0 7px;color:#fff}
.tk-bot p{margin:0;font-size:11.5px;color:#A9C4BC;line-height:1.5}

/* ---------- profile ---------- */
.prof{padding:2px 22px 20px;display:flex;align-items:center;gap:15px}
.prof .av{width:58px;height:58px;border-radius:20px;background:linear-gradient(150deg,#2F6B4F,#0E3D34);
  color:var(--mint);display:grid;place-items:center;font-family:var(--dp);font-weight:700;font-size:19px;letter-spacing:-.02em}
.prof h2{font-family:var(--dp);font-weight:700;font-size:20px;margin:0;letter-spacing:-.03em}

/* ---------- dark theme ---------- */

.srchhead{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;display:flex;gap:10px;align-items:center;

  text-transform:uppercase;color:var(--muted)}

/* ---------- notifications ---------- */
.nrow{display:flex;gap:13px;align-items:flex-start;background:var(--white);border:1px solid var(--line);
  border-radius:18px;padding:14px;width:100%;text-align:left;box-shadow:var(--sh)}

  display:grid;place-items:center;border:2px solid var(--cream)}

/* ---------- forms ---------- */
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--dp);font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--white);

.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(47,107,79,.12)}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);

.two{display:flex;gap:11px}.two .fld{flex:1}
.hint{font-size:11.5px;color:var(--muted);margin:-4px 0 14px;line-height:1.5}
.codein{font-family:var(--dp);font-weight:700;font-size:19px;letter-spacing:.12em;text-align:center;text-transform:uppercase}

/* ---------- why / explainability ---------- */
.why{background:linear-gradient(140deg,var(--pale),var(--white));border:1px solid var(--mint2);

/* ---------- temps ---------- */
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=s=>{const p=s.split(":");return (+p[0])*60+(+p[1])};
const mh=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function windowOf(d){
 const n=nowMin(),s=hm(d.from),e=hm(d.to);
 if(e<=n)return {s:s+1440,e:e+1440,tm:true};
 return {s:s,e:e,tm:false};
}
function fmtDur(m){
 m=Math.max(0,Math.round(m));
 if(m<60)return t("hmin",m);
 const h=Math.floor(m/60),r=m%60;
 return r?t("hhm",h,String(r).padStart(2,"0")):t("hh",h);
}
function statusOf(d){
 if(stockOf(d)<=0)return "sold";
 const n=nowMin(),w=windowOf(d);
 if(!w.tm&&n>=w.s&&n<w.e)return "open";
 if(w.s-n<=120)return "soon";
 return "later";
}
function pillOf(d){
 const st=statusOf(d),n=nowMin(),w=windowOf(d);
 if(st==="sold")return {c:"gone",x:t("sold"),ic:""};
 if(st==="open")return {c:"now",x:t("closes_in",fmtDur(w.e-n)),ic:"bl"};
 if(st==="soon")return {c:"soon",x:t("pickup_in",fmtDur(w.s-n)),ic:"clock"};
 return {c:"",x:w.tm?t("pickup_at_tmr",d.from):t("pickup_at",d.from),ic:"clock"};
}
function pillHtml(d){
 const p=pillOf(d);
 return `<span class="pill ${p.c}" data-cd="${d.id}">${p.ic==="bl"?'<i class="bl"></i>':p.ic?I(p.ic,12):""}<span>${p.x}</span></span>`;
}
function tickCd(){
 document.querySelectorAll("[data-cd]").forEach(n=>{
  const d=byId(+n.getAttribute("data-cd"));if(!d)return;
  const p=pillOf(d);n.className="pill "+p.c;
  n.innerHTML=(p.ic==="bl"?'<i class="bl"></i>':p.ic?I(p.ic,12):"")+"<span>"+p.x+"</span>";
 });
 const c=el("clock");if(c){const n=new Date();c.textContent=n.getHours()+":"+String(n.getMinutes()).padStart(2,"0")}
 checkPickupAlerts();
}

/* ---------- distance ---------- */
function zonePos(z){const f=ZONES.find(x=>x[0]===z);return f?{la:f[2],lo:f[1]}:{la:14.7195,lo:-17.4585}}
const userPos=()=>S.pos||zonePos(S.zone);
function kmBetween(a,b){
 const R=6371,r=Math.PI/180;
 const dla=(b.la-a.la)*r,dlo=(b.lo-a.lo)*r;
 const s=Math.sin(dla/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dlo/2)**2;
 return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
const distOf=d=>kmBetween(userPos(),{la:d.la,lo:d.lo});
function fmtKm(k){
 if(k<1)return Math.round(k*100)*10+" m";
 return (LI===1?k.toFixed(1):k.toFixed(1).replace(".",","))+" km";
}

 let cat=0,merch=0;
 done.forEach(o=>{const off=byId(o.id);if(!off)return;
  if(off.cat===d.cat)cat+=o.qty;if(off.merch===d.merch)merch+=o.qty});
 return {cat,merch,fav:isFav(d.id)};
}
function scoreOf(d){
 const n=nowMin(),w=windowOf(d),km=distOf(d),ta=taste(d),st=statusOf(d);
 const f={};
 f.f_price=clamp((pct(d)-52)/26);
 f.f_taste=clamp((ta.fav?.45:0)+Math.min(.35,ta.cat*.12)+Math.min(.35,ta.merch*.18));
 f.f_near=clamp(1-km/9);
 f.f_time=st==="open"?1:st==="soon"?clamp(1-(w.s-n)/240):clamp(.55-(w.s-n)/1600);
 f.f_rare=stockOf(d)<=1?1:stockOf(d)<=2?.8:stockOf(d)<=4?.5:.25;
 f.f_rating=clamp((d.rate-3.7)/1.1);
 let s=0;WEIGHTS.forEach(([k,wt])=>s+=wt*f[k]);
 if(st==="sold")s*=.15;
 if(d.isNew)s+=.04;
 return {s:clamp(s),f:f,km:km,ta:ta};
}
function reasonsOf(d){
 const r=scoreOf(d),out=[],ta=r.ta,st=statusOf(d),w=windowOf(d),n=nowMin();
 if(ta.merch>=2)out.push([r.f.f_taste,t("why_merch",ta.merch)]);
 else if(ta.fav)out.push([r.f.f_taste,t("why_fav")]);
 else if(ta.cat>=2)out.push([r.f.f_taste,t("why_cat",catL(d.cat))]);
 if(st==="open")out.push([r.f.f_time,t("why_now")]);
 else if(st==="soon")out.push([r.f.f_time,t("why_soon")]);
 if(r.km<1.6)out.push([r.f.f_near,t("why_near2",fmtKm(r.km))]);
 if(stockOf(d)<=2&&st!=="sold")out.push([r.f.f_rare,t("why_last")]);
 if(pct(d)>=66)out.push([r.f.f_price,t("why_deal",pct(d))]);
 out.sort((a,b)=>b[0]-a[0]);
 return {score:r.s,f:r.f,km:r.km,list:out.map(x=>x[1])};
}
function ranked(list){
 if(online())return list.slice();
 return list.map(d=>({d:d,r:scoreOf(d).s})).sort((a,b)=>b.r-a.r).map(x=>x.d);
}
function sortList(list){
 if(online()&&S.sort==="reco")return list.slice();
 const l=list.slice();
 if(S.sort==="price")return l.sort((a,b)=>a.price-b.price);
 if(S.sort==="dist")return l.sort((a,b)=>distOf(a)-distOf(b));
 if(S.sort==="time")return l.sort((a,b)=>windowOf(a).s-windowOf(b).s);
 return ranked(l);
}

/* =========================================================
   Client API - le serveur quand il repond, la demo sinon
   ========================================================= */
const AKEY="ai4food.session.v1";
const API={
 base:"",online:false,token:null,rtoken:null,me:null,
 url(p){return this.base+"/api"+p},
 async raw(method,path,body,retry){
  const r=await fetch(this.url(path),{
   method:method,
   headers:Object.assign(body?{"content-type":"application/json"}:{},this.token?{authorization:"Bearer "+this.token}:{}),
   body:body?JSON.stringify(body):undefined});
  if(r.status===401&&this.rtoken&&retry!==false){
   if(await this.renew())return this.raw(method,path,body,false);
   this.signOut(true);
  }
  const txt=await r.text();
  const data=txt?JSON.parse(txt):null;
  if(!r.ok){
   const e=new Error((data&&data.error&&data.error.message)||"Erreur réseau");
   e.code=data&&data.error?data.error.code:"network";e.status=r.status;throw e;
  }
  return data;
 },
 get(p){return this.raw("GET",p)},
 post(p,b){return this.raw("POST",p,b||{})},
 put(p,b){return this.raw("PUT",p,b||{})},
 del(p){return this.raw("DELETE",p)},
 async renew(){
  try{
   const r=await fetch(this.url("/auth/refresh"),{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify({refresh_token:this.rtoken})});
   if(!r.ok)return false;
   this.session(await r.json());return true;
  }catch(e){return false}
 },
 session(s){
  this.token=s.access_token;this.rtoken=s.refresh_token;this.me=s.user;
  try{localStorage.setItem(AKEY,JSON.stringify({t:s.access_token,r:s.refresh_token}))}catch(e){}
 },
 restore(){
  try{const s=JSON.parse(localStorage.getItem(AKEY)||"null");if(s){this.token=s.t;this.rtoken=s.r}}catch(e){}
 },
 signOut(silent){
  const rt=this.rtoken;
  this.token=null;this.rtoken=null;this.me=null;
  try{localStorage.removeItem(AKEY)}catch(e){}
  if(rt)fetch(this.url("/auth/logout"),{method:"POST",headers:{"content-type":"application/json"},
   body:JSON.stringify({refresh_token:rt})}).catch(()=>{});
  S.remote={offers:[],orders:[],notifs:[],impact:null,merchants:[]};
  S.role="client";S.tab="home";
  if(!silent)toast(t("signed_out"));
  render(true);
 }
};

const signedIn=()=>!!(API.online&&API.me);

function apiBase(){
 try{
  const q=new URLSearchParams(location.search).get("api");
  if(q!==null){localStorage.setItem("ai4food.api",q);return q.replace(/\/$/,"")}
  const saved=localStorage.getItem("ai4food.api");

 return "http://localhost:4000";

const MX=lo=>(lo+17.545)/0.14*360, MY=la=>(14.775-la)/0.13*320;
function offersAt(v){
 if(online())return CAT().filter(d=>d.merchSrv===v.srv);
 return CAT().filter(d=>d.merch===v.n||v.n.indexOf(d.merch)>=0||d.merch.indexOf(v.n)>=0);
}
function mapSvg(list){
 const land=COAST.map((p,i)=>(i?"L":"M")+MX(p[0]).toFixed(1)+" "+MY(p[1]).toFixed(1)).join(" ")+" Z";
 const u=userPos();
 const pins=list.map(v=>{const idx=MV().indexOf(v);const x=MX(v.lo).toFixed(1),y=MY(v.la).toFixed(1);
  const sel=S.sel===idx,live=v.live||offersAt(v).length>0;
  return `<g onclick="selPin(${idx})" style="cursor:pointer">
   ${sel?`<circle cx="${x}" cy="${y}" r="13" fill="var(--emerald)" opacity=".18"/>`:""}
   <circle cx="${x}" cy="${y}" r="${sel?7:live?5.5:4.5}" fill="${live?"var(--forest)":"var(--white)"}" stroke="${live?"var(--cream)":"var(--emerald)"}" stroke-width="${live?1.6:1.8}"/>
   ${live?`<circle cx="${x}" cy="${y}" r="2" fill="var(--mint)"/>`:""}</g>`}).join("");
 return `<svg viewBox="0 0 360 320" class="mapsvg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(t("map"))}">
  <rect x="0" y="0" width="360" height="320" fill="var(--water)"/>
  <path d="${land}" fill="var(--land)" stroke="var(--mint-line)" stroke-width="1.5"/>
  ${ZONES.map(z=>`<text x="${MX(z[1]).toFixed(1)}" y="${MY(z[2]).toFixed(1)}" class="zl">${z[0]}</text>`).join("")}
  ${pins}
  <g><circle cx="${MX(u.lo).toFixed(1)}" cy="${MY(u.la).toFixed(1)}" r="9" fill="var(--emerald)" opacity=".16"/>
   <circle cx="${MX(u.lo).toFixed(1)}" cy="${MY(u.la).toFixed(1)}" r="4.5" class="usr"/></g></svg>`;
}

/* ---------- pile de feuilles ---------- */
let lastFocus=null;
function pushSheet(name,arg){
 if(!S.stack.length)lastFocus=document.activeElement;
 S.stack.push({n:name,a:arg});drawSheet();
}
function reSheet(){if(S.stack.length)drawSheet()}
function drawSheet(){
 const top=S.stack[S.stack.length-1];if(!top)return;
 const s=el("sheet");
 s.innerHTML=SHEETS[top.n](top.a);
 s.classList.add("open");s.setAttribute("aria-hidden","false");
 const f=s.querySelector("input")||s.querySelector("button");
 if(f&&top.n==="search")setTimeout(()=>f.focus(),60);
}
function back(){
 S.stack.pop();
 if(!S.stack.length)closeSheet();else drawSheet();
}
function closeSheet(){
 S.stack=[];const s=el("sheet");
 s.classList.remove("open");s.setAttribute("aria-hidden","true");
 S.qty=1;setTimeout(()=>{if(!S.stack.length)s.innerHTML=""},380);
 if(lastFocus&&lastFocus.focus)lastFocus.focus();
}

function useGps(){
 if(!navigator.geolocation)return toast(t("gps_fail"),true);
 navigator.geolocation.getCurrentPosition(p=>{
  S.pos={la:p.coords.latitude,lo:p.coords.longitude};

  if(signedIn())API.raw("PATCH","/auth/me",{zone:S.zone,lat:S.pos.la,lng:S.pos.lo}).then(()=>syncAll()).catch(()=>{});
 },()=>toast(t("gps_fail"),true),{timeout:8000});

/* ---------- commandes ---------- */
function endTsOf(d){
 const w=windowOf(d),now=new Date();
 const base=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
 return base+w.e*6e4;
}
async function confirm_(){
 const d=byId(S.cur),q=Math.min(S.qty,stockOf(d));
 if(online()){
  try{
   const r=await API.post("/orders",{offer_id:d.srv,qty:q,payment_method:S.pay});
   await Promise.all([pullOrders(),pullCatalog(),pullNotifs(),pullImpact()]);
   S.stack=[{n:"done",a:r.order.id}];drawSheet();render();
  }catch(e){toast(e.message,true);if(e.code==="out_of_stock"){await pullCatalog();render()}}
  return;
 }
 const o={oid:uid(),id:d.id,qty:q,pay:S.pay,code:code4(),ts:Date.now(),endTs:endTsOf(d),status:"active"};
 S.orders.unshift(o);
 S.stock[d.id]=Math.max(0,stockOf(d)-q);
 notify("ok",[o.qty+" × "+d.name,d.merch,o.code],"checkC");
 save();S.stack=[{n:"done",a:o.oid}];drawSheet();render();
}
function cancelOrder(oid){
 if(online()){
  guard(()=>API.post("/orders/"+oid+"/cancel",{}),t("cancelled_toast"))
   .then(()=>Promise.all([pullOrders(),pullCatalog(),pullImpact()])).then(()=>render()).catch(()=>{});
  return;
 }
 const o=S.orders.find(x=>x.oid===oid);if(!o)return;
 const d=byId(o.id);o.status="cancel";
 if(d)S.stock[d.id]=stockOf(d)+o.qty;
 save();render();toast(t("cancelled_toast"));
}

 if(online()){
  guard(()=>API.post("/merchant/pickups/validate",{code:v}),t("m_valid_ok",v))
   .then(()=>syncAll()).catch(()=>{});
  return;
 }
 if(v.indexOf("AI4-")!==0)v="AI4-"+v.replace(/^AI4/,"");
 const o=mOrders().find(x=>x.code===v&&x.status==="active");
 if(!o)return toast(t("m_valid_bad"),true);
 o.status="done";save();render();toast(t("m_valid_ok",o.code));
}

  from:from,to:to,addr:"Keur Gorgui, Sacré-Cœur",rate:4.6,avis:274,left:q,la:14.7189,lo:-17.4665,

function doPublish(){
 const g=i=>{const n=el(i);return n?n.value.trim():""};
 if(online()){
  const body={name:g("pn"),price_cfa:+g("pp"),was_cfa:+g("pw"),qty:+g("pq"),
   pickup_from:g("pf")||"19:30",pickup_to:g("pt")||"20:30",description:g("pd")};
  if(!body.name||!body.price_cfa||!body.qty)return toast(t("m_fill"),true);
  guard(()=>API.post("/merchant/offers",body),t("m_posted",body.qty))
   .then(()=>{closeSheet();return syncAll(true)}).catch(()=>{});
  return;
 }
 const name=g("pn"),price=+g("pp"),was=+g("pw"),q=+g("pq"),from=g("pf")||"19:30",to=g("pt")||"20:30",desc=g("pd");
 if(!name||!price||!q)return toast(t("m_fill"),true);
 if(was<=price)return toast(t("m_price_err"),true);
 newOffer(name,price,was,q,from,to,desc);
 closeSheet();render(true);toast(t("m_posted",q));
}
function publishForecast(){
 if(online()){
  guard(()=>API.post("/merchant/forecast/publish",{}),t("m_posted",S.desk?S.desk.forecast.predicted_surplus:1))
   .then(()=>{S.tab="mhome";return syncAll(true)}).catch(()=>{});
  return;
 }
 newOffer("Pains & viennoiseries",1000,3000,7,"19:30","20:30",
  "Baguettes du jour, croissants et pains au chocolat. Contenu variable selon les invendus.");
 S.tab="mhome";render(true);toast(t("m_posted",7));
}

/* =========================================================
   Onboarding + coque
   ========================================================= */
const OB=[["leaf","ob1_t","ob1_s"],["spark","ob2_t","ob2_s"],["wallet","ob3_t","ob3_s"]];
function renderOb(){
 const n=el("ob");
 if(S.seen){n.classList.add("hide");n.innerHTML="";el("sb").classList.remove("dark");return}
 const [ic,tk,sk]=OB[S.ob];
 n.classList.remove("hide");
 n.innerHTML=`
  <div class="lgrow">${LANGS.map((l,i)=>`<button class="lgb ${LI===i?"on":""}" onclick="obLang(${i})">${l[1]}</button>`).join("")}</div>
  <button class="skip" onclick="startApp()">${t("ob_skip")}</button>
  <div class="obslide">
   ${S.ob===0?'<h2>AI<em>4</em>Food</h2>':`<div class="obic">${I(ic,34)}</div>`}
   <p class="t">${t(tk)}</p>
   <p class="s">${t(sk)}</p>
  </div>
  <div class="dots">${OB.map((_,i)=>`<i class="${i===S.ob?"on":""}"></i>`).join("")}</div>
  <button class="start" onclick="obNext()">${S.ob<OB.length-1?t("ob_next"):t("ob_start")}</button>`;
}
function obNext(){if(S.ob<OB.length-1){S.ob++;renderOb()}else startApp()}
function obLang(i){LI=i;S.lang=LANGS[i][0];save();applyTheme();renderOb();render()}
function startApp(){S.seen=true;save();renderOb();render()}
function pitch(){
 const n=el("pitch");if(!n)return;
 const im=impact();
 n.innerHTML=`
  <div class="lock"><div class="wordmark">AI<em>4</em>Food</div></div>
  <p class="tag">${t("ob1_t")}</p>
  <p class="sub">${t("p_sub",V.length,CAT().length)}</p>
  <div class="marks">
   <div class="mk a" style="color:var(--mint)">${I("leaf",26)}</div>
   <div class="mk b" style="color:#0A2E27">${I("spark",26)}</div>
   <div class="mk c" style="color:var(--emerald)">${I("store",26)}</div></div>
  <div class="kv">${t("p_kv1")}</div>
  <ul>${["p_i1","p_i2","p_i3","p_i4","p_i5"].map(k=>`<li>${t(k)}</li>`).join("")}</ul>
  <div class="kv">${t("p_kv2")}</div>
  <p class="sub" style="margin-bottom:18px">${t("p_impact",im.meals,im.co2,F(im.saved))}</p>
  <p class="fine">${t("p_fine")}</p>`;
}

/* =========================================================
   Rendu
   ========================================================= */
const TABS_ADMIN_ONLINE=[["adash","trend","tab_adash"],["apipe","store","tab_apipe"],
 ["aorders","receipt","tab_aorders"],["apay","wallet","tab_apay"],["profile","user","tab_profile"]];
const TABS={
 client:[["home","compass","tab_home"],["places","pin","tab_places"],["fav","heart","tab_fav"],["orders","receipt","tab_orders"],["profile","user","tab_profile"]],
 merchant:[["mhome","store","tab_mtoday"],["mai","trend","tab_mfc"],["mcodes","receipt","tab_mcodes"],["profile","user","tab_profile"]],
 admin:[["adash","trend","tab_adash"],["places","pin","tab_places"],["aorders","receipt","tab_aorders"],["profile","user","tab_profile"]]
};
const SCREENS_DEMO={home:home,places:places,fav:favs,orders:orders,profile:profile,
 mhome:mhome,mai:mai,mcodes:mcodes,adash:adash,aorders:aorders};
const SCREENS_ONLINE={home:home,places:places,fav:favs,orders:orders,profile:profile,
 mhome:mhomeOnline,mai:maiOnline,mcodes:mcodesOnline,
 adash:adashOnline,aorders:aordersOnline,apipe:apipe,ausers:ausers,apay:apay};
const SCREENS=()=>online()?SCREENS_ONLINE:SCREENS_DEMO;
const tabsFor=r=>(r==="admin"&&online()?TABS_ADMIN_ONLINE:TABS[r]);
function render(resetScroll){
 syncOrders();
 const tabs=tabsFor(S.role);
 if(!tabs.some(x=>x[0]===S.tab))S.tab=tabs[0][0];
 const v=el("view"),y=v.scrollTop;
 v.innerHTML=(SCREENS()[S.tab]||home)();
 v.scrollTop=resetScroll?0:y;
 el("tabs").innerHTML=tabs.map(([k,ic,l])=>
  `<button class="tab ${S.tab===k?"on":""}" role="tab" aria-selected="${S.tab===k}" onclick="go('${k}')">${I(ic,21)}${t(l)}</button>`).join("");
 pitch();
}
async function boot(){
 load();
 const i=LANGS.findIndex(l=>l[0]===S.lang);LI=i<0?0:i;
 applyTheme();
 if(window.matchMedia)try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.theme==="auto"){applyTheme();render()}})}catch(e){}
 renderOb();render(true);tickCd();
 await connect();
 if(online()){
  if(API.token){try{const me=await API.get("/auth/me");API.me=me.user;
   S.role=API.me.role==="admin"?"admin":API.me.role==="merchant"?"merchant":"client";
   S.tab=tabsFor(S.role)[0][0];}catch(e){API.signOut(true)}}
  await syncAll(true);
  setInterval(()=>{if(!document.hidden&&!S.stack.length)syncAll()},60000);
 }
 setInterval(tickCd,20000);
 document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.stack.length){e.preventDefault();back()}
 });
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();tickCd()}});
}
boot();
</script>
</body>
